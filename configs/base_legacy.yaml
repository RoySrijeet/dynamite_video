DATASETS:
  BURST:
    TRAINING:
      FPS: 30
      FRAME_SAMPLING_MULTIPLICATIVE_FACTOR: 3.0
      MAX_NUM_INSTANCES: 4
    INFERENCE:
      SPLIT: val
  CITYSCAPES_VPS:
    TRAINING:
      FPS: 10
      FRAME_SAMPLING_MULTIPLICATIVE_FACTOR: 1   # there aren't that many frames per vid
      MAX_NUM_INSTANCES: 4
    INFERENCE:
      SPLIT: val
  DAVIS:
    TRAINING:
      FPS: 30
      FRAME_SAMPLING_MULTIPLICATIVE_FACTOR: 3.0
      MAX_NUM_INSTANCES: 4
    INFERENCE:
      SPLIT: val
  KITTI_STEP:
    TRAINING:
      FPS: 10
      FRAME_SAMPLING_MULTIPLICATIVE_FACTOR: 3.0
      MAX_NUM_INSTANCES: 4
    INFERENCE:
      SPLIT: val
  MOSE:
    TRAINING:
      FPS: 30
      FRAME_SAMPLING_MULTIPLICATIVE_FACTOR: 3.0
      MAX_NUM_INSTANCES: 4
    INFERENCE:
      SPLIT: val
  PUMAVOS:
    TRAINING:
      FPS: 30
      FRAME_SAMPLING_MULTIPLICATIVE_FACTOR: 3.0
      MAX_NUM_INSTANCES: 4
    INFERENCE:
      SPLIT: val
  VIPSEG:
    TRAINING:
      FPS: 5
      FRAME_SAMPLING_MULTIPLICATIVE_FACTOR: 3.0
      MAX_NUM_INSTANCES: 4
    INFERENCE:
      SPLIT: val
MODEL:
  BACKBONE:
    FREEZE_AT: 2
    NAME: D2SwinTransformer
  SWIN:
    EMBED_DIM: 96
    DEPTHS: [2, 2, 6, 2]
    NUM_HEADS: [3, 6, 12, 24]
    WINDOW_SIZE: 7
    APE: False
    DROP_PATH_RATE: 0.3
    PATCH_NORM: True
  WEIGHTS: "weights/swin_tiny_patch4_window7_224.pkl"
  PIXEL_MEAN: [123.675, 116.280, 103.530]   # RGB order
  PIXEL_STD: [58.395, 57.120, 57.375]
  # PIXEL_MEAN: [103.53, 116.28, 123.675]       # BGR order
  # PIXEL_STD: [57.375, 57.12, 58.395]
  META_ARCHITECTURE: "DynamiteModel"
  SEM_SEG_HEAD:
    NAME: "DynamiteHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 80
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    REFINE_MASK_FEATURES: True
    # pixel decoder
    PIXEL_DECODER_NAME: "MSDeformAttnPixelDecoder"
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 6
  MASK_FORMER:
    INTERACTIVE_TRANSFORMER_NAME: "DynamiteInteractiveTransformer"
    TRANSFORMER_IN_FEATURE: "multi_scale_pixel_decoder"
    DEEP_SUPERVISION: True
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    HIDDEN_DIM: 256
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 2048
    PRE_NORM: False
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    ENC_LAYERS: 10  # 9 encoder layers, add one for the loss on learnable query
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    DECODER:
      USE_DECODER: True
      DEC_LAYERS: 5
      DEC_SCALE_FACTOR: 1.0
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.0001
  STEPS: (327778, 355092)
  MAX_ITER: 368750 #368750
  WARMUP_FACTOR: 1.0
  WARMUP_ITERS: 10
  WEIGHT_DECAY: 0.05
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: 0.1
  CHECKPOINT_PERIOD: 10000
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0
  AMP:
    ENABLED: True
INPUT:
  AUGMENTATION:   # data augmentation parameters
    # color augmentation
    COLOR_AUG: true
    # resize parameters
    MAX_DIM_TRAIN: 910
    MIN_DIM_TRAIN: 512
    RESIZE_TEST:
    MAX_DIM_TEST: 
    MIN_DIM_TEST:

    # random horizontal flip
    RANDOM_FLIP: true
    RANDOM_FLIP_PROB: 0.5
    RANDOM_FLIP_AXIS: "horizontal"
    # random crop (2:1 aspect ratio)
    RANDOM_CROP: true
    # IMPORTANT: final frame dimensions, must be divisible by MASK_FORMER.SIZE_DIVISIBILITY
    IMAGE_SIZE: 512     # crop target dims
    #RANDOM_CROP_FACTOR: 0.75
    #MASK_PRESERVING_CROP_REF_FRAME: 0

  NORMALIZE_TO_UNIT_SCALE: false
  RGB: true

TRAINING:
  MIN_MASK_AREA: 400
  CLIP_LENGTH: 3
  DATASET_LIST: [BURST, CITYSCAPES_VPS, DAVIS, KITTI_STEP, MOSE, PUMAVOS, VIPSEG]
  DATASET_WEIGHTS: [0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.1]
  # total num of training iterations
  #NUM_ITERATIONS: 6400 # SOLVER.MAX_ITER
  # number of samples in a batch across all GPUs
  #BATCH_SIZE: 8 # SOLVER.IMS_PER_BATCH
  # save checkpoint every
  CHECKPOINT_SAVE_INTERVAL: 1600
  # #iters after which checkpoints will be regularly saved
  SAVE_CKPTS_AFTER: 0
  # max #checkpoints to keep on disk; older checkpoints are automatically deleted
  MAX_CKPTS_TO_KEEP: 2
  # run training with mixed precision
  AMP: false
  # gradients
  ACCUMULATE_GRADIENTS: true
  CLIP_GRADIENTS: false
  # run forward and backward passes with `torch.autograd.detect_anomaly`; useful for debugging only
  DETECT_ANOMALY: false
  # ignore OOMs, training skips to next iteration; only applies to single GPU training
  IGNORE_OOM_ERRORS: false
  # Learning rate
  BASE_LR: 0.0001
  LR_DECAY_RATES:
  - 0.0
  LR_DECAY_STEPS:
  - 0
  LR_WARMUP_ITERATIONS: 0
  # maximum number of batch samples to use per GPU
  MAX_SAMPLES_PER_GPU: 1
  # number of CPU workers to use for data-loading (per GPU process)
  NUM_CPU_WORKERS: -1
  # specifies the iteration interval for printing training metrics to console
  DISPLAY_INTERVAL: 5
  # specifies the iteration interval for saving metrics summary to tensorboard or Wandb
  SUMMARY_INTERVAL: 20

TEST:
  EVAL_PERIOD: 400000
DATALOADER:
  ASPECT_RATIO_GROUPING: True
  FILTER_EMPTY_ANNOTATIONS: True
  NUM_WORKERS: 4
ITERATIVE:
  TRAIN:
    # CLASS_AGNOSTIC: True
    POSITIONAL_EMBED: "spatio_temporal" #[ "temporal", "spatial", "spatio_temporal", None]
    USE_STATIC_BG_QUERIES: True
    NUM_STATIC_BG_QUERIES: 9
    MAX_NUM_INTERACTIONS: 3
  TEST:
    INTERACTIVE_EVALAUTION: True
    # EVAL_STRATEGY: "random"
    MAX_NUM_INTERACTIONS: 20
    IOU_THRESHOLD: 0.85

CLICKER:
  TRAINING:
    # max #clicks *per-instance* to be sampled from a frame
    MAX_NUM_CLICKS_PER_INSTANCE: 6            # default: 6
    # whether to add first click at object center
    FIRST_CLICK_CENTER: true                  # default: true
    # prob of choosing optional frames to add foreground clicks in
    OPTIONAL_FRAMES_FG_SAMPLE_PROB: 0.2
    # probability scaling factor of sampling n no. of clicks
    GAMMA: 0.7                                 # default: 0.7 
    # probability of sampling background clicks from a frame
    BACKGROUND_SAMPLING_PROB: 0.2
    
LOGGING:
  # Log level for the main process (rank 0)
  LOG_LEVEL: INFO
  # Log level for all subprocesses (rank >= 1)
  SUBPROCESS_LOG_LEVEL: WARN

WANDB:
  # to turn off WANDB logging, set `ENABLE` to false
  ENABLE: true
  ENTITY:
  PROJECT:
  RUN_NAME:

OUTPUT_DIR: # experiment dir, specify in cl args
DEBUG: false
SEED: 2091831170
VERSION: 2